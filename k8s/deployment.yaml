apiVersion: apps/v1
kind: Deployment
metadata:
  name: zomato-dashboard
  namespace: zomato-analytics
  labels:
    app.kubernetes.io/name: zomato-dashboard
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: zomato-data-platform
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: zomato-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zomato-dashboard
        app.kubernetes.io/component: frontend
    spec:
      # Security Context: Enforce non-root execution matching Dockerfile appuser (UID 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: zomato-analysis-dashboard:latest
          # In local/lightweight clusters, IfNotPresent uses the locally built Docker image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-streamlit
              containerPort: 8501
              protocol: TCP
          envFrom:
            - configMapRef:
                name: zomato-dashboard-config
          resources:
            requests:
              cpu: "150m"
              memory: "384Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          # Startup probe allows up to 60s for initial data loading into pandas dataframe
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http-streamlit
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          # Liveness probe checks if the Streamlit server process is responsive
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http-streamlit
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          # Readiness probe ensures traffic is routed only to ready pods
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http-streamlit
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
      restartPolicy: Always
