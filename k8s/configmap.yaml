apiVersion: v1
kind: ConfigMap
metadata:
  name: zomato-dashboard-config
  namespace: zomato-analytics
  labels:
    app.kubernetes.io/name: zomato-dashboard
    app.kubernetes.io/component: config
data:
  # Streamlit Server Configuration
  STREAMLIT_SERVER_PORT: "8501"
  STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
  STREAMLIT_SERVER_HEADLESS: "true"
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
  STREAMLIT_SERVER_MAX_UPLOAD_SIZE: "200"
  
  # Streamlit Branding & Theme (Zomato Crimson Accent)
  STREAMLIT_THEME_BASE: "light"
  STREAMLIT_THEME_PRIMARY_COLOR: "#E23744"
  STREAMLIT_THEME_BACKGROUND_COLOR: "#FFFFFF"
  STREAMLIT_THEME_SECONDARY_BACKGROUND_COLOR: "#F8F9FA"
  STREAMLIT_THEME_TEXT_COLOR: "#1C1C1C"
