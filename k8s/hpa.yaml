apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zomato-dashboard-hpa
  namespace: zomato-analytics
  labels:
    app.kubernetes.io/name: zomato-dashboard
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zomato-dashboard
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
