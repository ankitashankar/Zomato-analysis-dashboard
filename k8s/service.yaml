apiVersion: v1
kind: Service
metadata:
  name: zomato-dashboard-service
  namespace: zomato-analytics
  labels:
    app.kubernetes.io/name: zomato-dashboard
    app.kubernetes.io/component: service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zomato-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http-streamlit
      nodePort: 30501
      protocol: TCP
---
# LoadBalancer Service: In Docker Desktop, this automatically binds port 8501 to localhost
apiVersion: v1
kind: Service
metadata:
  name: zomato-dashboard-lb
  namespace: zomato-analytics
  labels:
    app.kubernetes.io/name: zomato-dashboard
    app.kubernetes.io/component: loadbalancer
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: zomato-dashboard
  ports:
    - name: http
      port: 8501
      targetPort: http-streamlit
      protocol: TCP
